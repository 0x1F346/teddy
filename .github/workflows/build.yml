name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:

jobs:

  build-windows:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      Solution_Name: Teddy.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Restore
      run: dotnet restore $env:Solution_Name

    - name: Build the application
      run: msbuild $env:Solution_Name -t:rebuild -property:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TeddyBench-${{ matrix.configuration }}
        path: TeddyBench/bin/${{ matrix.configuration }}/net48/win10-x64/TeddyBench.exe
      env:
        Configuration: ${{ matrix.configuration }}

  build-macos:

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Teddy CLI
      run: dotnet build Teddy/Teddy.csproj -c Release

    - name: Run tests
      run: dotnet test TonieAudio.Tests/TonieAudio.Tests.csproj -c Release

    - name: Publish Teddy CLI (osx-arm64)
      run: dotnet publish Teddy/Teddy.csproj -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -o publish/osx-arm64

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: teddy-osx-arm64
        path: publish/osx-arm64/Teddy
